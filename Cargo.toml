[package]
name = "repohub"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repohub"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["markdown"] }

serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
pollster = "0.4"
portable-pty = "0.9"
vt100 = "0.18"
# Checks downloaded updates against the release's SHA256SUMS.
sha2 = "0.10"
# Plugins: sandboxed Luau scripts that build Rune UI (src/plugins.rs); `watch` reloads a plugin
# when one of its files is saved.
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["watch"] }

# The menu bar item on macOS (Rune's tray covers Windows and Linux).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# A smaller desktop app: no debug symbols, code optimized for size (the same frame times as -O3
# here, a third smaller) and across crates at link time. Panics still unwind: Rune's image decoder
# catches a codec's panic instead of crashing the app.
[profile.release]
strip = true
opt-level = "s"
lto = "thin"
