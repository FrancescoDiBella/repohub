[package]
name = "repohub"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repohub"
path = "src/main.rs"

[dependencies]
# Rune's default features without two: `embedded-fonts`, Rune's own copy of Inter and IBM Plex Mono
# for the web build, which would sit next to the same fonts RepoHub registers (`FONTS` in
# src/lib.rs); and `ogg-audio`, audio decoders for macOS that RepoHub never uses.
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", default-features = false, features = ["accessibility", "dbus", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["markdown"] }

serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Export and Import of a board use the system's save and open dialogs (rfd on macOS and Windows,
# the desktop portal on Linux). The web build can't have them.
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", default-features = false, features = ["native-file-dialog"] }
# TLS with the system's certificates (ureq leaves its bundled roots out then).
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
# The version Rune uses, so only one is compiled.
pollster = "1"
portable-pty = "0.9"
vt100 = "0.18"
# Checks downloaded updates against the release's SHA256SUMS.
sha2 = "0.10"
# Checks the signature of SHA256SUMS (Ed25519, minisign's format); no dependencies of its own.
minisign-verify = "0.2"
# Plugins: sandboxed Luau scripts that build Rune UI (src/plugins.rs); `watch` reloads a plugin
# when one of its files is saved.
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96", features = ["watch"] }

# The menu bar item on macOS (Rune's tray covers Windows and Linux).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# `cargo build/run/test --release`: no debug symbols, code optimized for size (the same frame
# times as -O3 here, a third smaller) and across crates at link time. Panics unwind: Rune's image
# decoder catches a codec's panic instead of crashing the app (src/main.rs checks it).
[profile.release]
strip = true
opt-level = "s"
lto = "thin"

# What the Desktop workflow ships (`cargo build --profile dist --bin repohub`, in target/dist):
# the whole program optimized as one unit. A fifth smaller than release and no slower, but a
# rebuild takes a couple of minutes more, so tests and `cargo run` keep the release profile.
# opt-level "z" would be another 10% smaller and 15% slower in the palette. Measured in
# CONTRIBUTING, "Size". Panics still unwind.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The web build (`scripts/web-build.sh`, in target/wasm32-unknown-unknown/web), the same way.
# Panics abort there anyway (the wasm32 target's default).
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
