# Builds the desktop app for macOS (one app for Apple silicon and Intel), Windows and Linux.
# - Every push to main rebuilds them and replaces the "Latest build" pre-release, so the newest
#   app is always at .../releases/tag/latest with no manual step.
# - Pushing a tag like v0.1.0 publishes them as a versioned GitHub release.
# - A pull request that touches the app or the packaging builds them too, as a check (nothing is
#   published): the terminal, Claude and status-bar code only compiles on macOS and Windows there.
# - It can also be run by hand (Actions → Desktop → Run workflow), which only makes artifacts.
name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation alone doesn't change the app.
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "packaging/**", ".github/workflows/release.yml"]

permissions:
  contents: write

# A newer push to main replaces the build of an older one.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      # The app knows which build it is, to update itself from the Latest build (src/update.rs).
      REPOHUB_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev" >> "$GITHUB_ENV"
          fi
          echo "REPOHUB_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      # The build names -lxkbcommon for the linker (Wayland and X11 are loaded at run time), and
      # the program ends up using none of its symbols. So no Ubuntu package is needed: link the
      # runner's runtime library under its unversioned name, or else an empty stand-in. A symbol
      # that really were used would then fail the link loudly, not ship a broken program.
      - name: xkbcommon for the linker (Linux)
        if: matrix.name == 'linux'
        run: |
          lib=/usr/lib/x86_64-linux-gnu
          if [ -e "$lib/libxkbcommon.so" ]; then exit 0; fi
          if [ -e "$lib/libxkbcommon.so.0" ]; then sudo ln -s libxkbcommon.so.0 "$lib/libxkbcommon.so"
          else echo 'void repohub_xkbcommon_stub(void) {}' | sudo cc -shared -x c - -o "$lib/libxkbcommon.so"; fi
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}

      - name: macOS app and disk image
        if: matrix.name == 'macos'
        run: packaging/macos/bundle.sh "$VERSION"

      - name: Windows zip
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release --bin repohub
          mkdir -p dist/RepoHub
          cp target/release/repohub.exe dist/RepoHub/RepoHub.exe
          cp .env.example dist/RepoHub/
          cd dist && 7z a "RepoHub-$VERSION-windows.zip" RepoHub

      - name: Linux archive
        if: matrix.name == 'linux'
        run: |
          cargo build --release --bin repohub
          mkdir -p "dist/repohub-$VERSION"
          cp target/release/repohub packaging/linux/repohub.desktop packaging/linux/repohub.png packaging/linux/install.sh "dist/repohub-$VERSION/"
          tar -C dist -czf "dist/RepoHub-$VERSION-linux-x86_64.tar.gz" "repohub-$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: RepoHub-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # A versioned release, from a v* tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # The rolling pre-release: always the newest build of main.
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The app checks what it downloads against these before installing it.
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Replace the "Latest build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built automatically from main at ${GITHUB_SHA::7}. It is replaced on every push; for a fixed version use a numbered release."
