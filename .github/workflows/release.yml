# Builds the desktop app for macOS (one app for Apple silicon and Intel), Windows and Linux,
# and the Android app (an APK).
# - Every push to main rebuilds them and replaces the "Latest build" pre-release, so the newest
#   app is always at .../releases/tag/latest with no manual step.
# - Pushing a tag like v0.1.0 publishes them as a versioned GitHub release.
# - A pull request that touches the app or the packaging builds them too, as a check (nothing is
#   published): the terminal, Claude and status-bar code only compiles on macOS and Windows there.
# - It can also be run by hand (Actions → Desktop → Run workflow): with "release" empty it only
#   makes artifacts; with a tag there (v0.2.0), run on main, it publishes that numbered release
#   from main's newest commit and creates the tag, with no `git push` of a tag.
name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation alone doesn't change the app.
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a numbered release from main: its tag, such as v0.2.0. Empty: only build."
        required: false
        default: ""
  pull_request:
    paths: ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "packaging/**", "android/**", "web/**", "scripts/android-web.sh", "scripts/web-build.sh", "scripts/install-wasm-opt.sh", ".github/workflows/release.yml"]

permissions:
  contents: write

# A newer push to main replaces the build of an older one, but never a numbered release that
# was started by hand: that one runs in a group of its own.
concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && inputs.release == '' }}

env:
  # The tag of a numbered release: the tag that was pushed, or the one typed in Run workflow.
  # Empty for every other build.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.release || '') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      # The app knows which build it is, to update itself from the Latest build (src/update.rs).
      REPOHUB_BUILD: ${{ github.sha }}
      # The public key updates are signed with: the app refuses an update whose checksums
      # aren't signed by its private half (the MINISIGN_SECRET_KEY secret). Empty: no check.
      REPOHUB_UPDATE_PUBKEY: ${{ vars.REPOHUB_UPDATE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -n "$RELEASE_TAG" ]; then
            # A numbered release must be the version Cargo.toml says (CONTRIBUTING, "Releasing").
            if [ "$RELEASE_TAG" != "v$cargo_version" ]; then
              echo "::error::Tag $RELEASE_TAG doesn't match version $cargo_version in Cargo.toml."
              exit 1
            fi
            version=$cargo_version
          else
            version=$cargo_version-dev
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The app shows it and picks its update channel by it (src/update.rs).
          echo "REPOHUB_VERSION=$version" >> "$GITHUB_ENV"
          echo "REPOHUB_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      # The build names -lxkbcommon for the linker (Wayland and X11 are loaded at run time), and
      # the program ends up using none of its symbols. So no Ubuntu package is needed: link the
      # runner's runtime library under its unversioned name, or else an empty stand-in. A symbol
      # that really were used would then fail the link loudly, not ship a broken program.
      - name: xkbcommon for the linker (Linux)
        if: matrix.name == 'linux'
        run: |
          lib=/usr/lib/x86_64-linux-gnu
          if [ -e "$lib/libxkbcommon.so" ]; then exit 0; fi
          if [ -e "$lib/libxkbcommon.so.0" ]; then sudo ln -s libxkbcommon.so.0 "$lib/libxkbcommon.so"
          else echo 'void repohub_xkbcommon_stub(void) {}' | sudo cc -shared -x c - -o "$lib/libxkbcommon.so"; fi
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.name }}
      # The packages are built with the `dist` profile (Cargo.toml): smaller, slower to link.

      - name: macOS app and disk image
        if: matrix.name == 'macos'
        run: packaging/macos/bundle.sh "$VERSION"

      - name: Windows zip
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --profile dist --bin repohub
          mkdir -p dist/RepoHub
          cp target/dist/repohub.exe dist/RepoHub/RepoHub.exe
          cp .env.example dist/RepoHub/
          cd dist && 7z a -mx=9 "RepoHub-$VERSION-windows.zip" RepoHub

      - name: Linux archive
        if: matrix.name == 'linux'
        run: |
          cargo build --profile dist --bin repohub
          mkdir -p "dist/repohub-$VERSION"
          cp target/dist/repohub packaging/linux/repohub.desktop packaging/linux/repohub.png packaging/linux/install.sh "dist/repohub-$VERSION/"
          tar -C dist -I 'gzip -9' -cf "dist/RepoHub-$VERSION-linux-x86_64.tar.gz" "repohub-$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: RepoHub-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # The Android app: the web build inside a WebView, with the account and the drawings kept on
  # the phone (android/README.md).
  android:
    runs-on: ubuntu-latest
    env:
      REPOHUB_BUILD: ${{ github.sha }}
      # Each build must have a higher number than the one it updates.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -n "$RELEASE_TAG" ]; then
            # A numbered release must be the version Cargo.toml says (CONTRIBUTING, "Releasing").
            if [ "$RELEASE_TAG" != "v$cargo_version" ]; then
              echo "::error::Tag $RELEASE_TAG doesn't match version $cargo_version in Cargo.toml."
              exit 1
            fi
            version=$cargo_version
          else
            version=$cargo_version-dev
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The app shows it and picks its update channel by it (src/update.rs).
          echo "REPOHUB_VERSION=$version" >> "$GITHUB_ENV"
          echo "REPOHUB_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Toolchain
        run: rustup show active-toolchain && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: wasm-bindgen and wasm-opt
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          scripts/install-wasm-opt.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The page
        run: scripts/android-web.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # With a keystore in the repository's secrets, updates install over the old app. Without
      # one the APK is signed with a key made for this build, and installs only on its own.
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key."
          fi
      - name: Tests and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon test assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/RepoHub-$VERSION-android.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: RepoHub-android
          path: dist/*.apk
          if-no-files-found: error

  # A versioned release: from a v* tag, or from Run workflow on main with the tag to create.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts
      # Run by hand, the release is made from main and its tag must be new: an existing release
      # is never replaced from here.
      - name: Check the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release is published from main, not from $GITHUB_REF_NAME."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]; then
            echo "::error::The tag $RELEASE_TAG already exists."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Signs the checksums, so the app can tell who made the release, not only that the
      # download isn't damaged (CONTRIBUTING.md, "Signing updates"). A build that carries the
      # public key refuses unsigned updates, so with the key set this step must not be skipped.
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          REPOHUB_UPDATE_PUBKEY: ${{ vars.REPOHUB_UPDATE_PUBKEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ -n "$REPOHUB_UPDATE_PUBKEY" ]; then
              echo "::error::REPOHUB_UPDATE_PUBKEY is set but the MINISIGN_SECRET_KEY secret is missing: the apps would refuse this release."
              exit 1
            fi
            echo "::notice::No MINISIGN_SECRET_KEY secret: the checksums are not signed."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -t "RepoHub ${GITHUB_SHA::7}"
          rm -f "$key"
          if [ -n "$REPOHUB_UPDATE_PUBKEY" ]; then
            minisign -V -P "$REPOHUB_UPDATE_PUBKEY" -m dist/SHA256SUMS
          fi
      # The notes are the version's section of CHANGELOG.md; GitHub's list of merged pull
      # requests follows them.
      - name: Release notes
        run: |
          if scripts/release-notes.sh "$RELEASE_TAG" > notes.md; then :
          else
            echo "::warning::CHANGELOG.md has no section for ${RELEASE_TAG#v}; using the Unreleased one."
            scripts/release-notes.sh > notes.md || echo "See the pull requests below." > notes.md
          fi
          cat notes.md
      # With a tag that doesn't exist yet (Run workflow), this creates it on this commit.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: notes.md
          generate_release_notes: true

  # The rolling pre-release: always the newest build of main.
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The app checks what it downloads against these before installing it.
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Signs the checksums, so the app can tell who made the release, not only that the
      # download isn't damaged (CONTRIBUTING.md, "Signing updates"). A build that carries the
      # public key refuses unsigned updates, so with the key set this step must not be skipped.
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          REPOHUB_UPDATE_PUBKEY: ${{ vars.REPOHUB_UPDATE_PUBKEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ -n "$REPOHUB_UPDATE_PUBKEY" ]; then
              echo "::error::REPOHUB_UPDATE_PUBKEY is set but the MINISIGN_SECRET_KEY secret is missing: the apps would refuse this release."
              exit 1
            fi
            echo "::notice::No MINISIGN_SECRET_KEY secret: the checksums are not signed."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -t "RepoHub ${GITHUB_SHA::7}"
          rm -f "$key"
          if [ -n "$REPOHUB_UPDATE_PUBKEY" ]; then
            minisign -V -P "$REPOHUB_UPDATE_PUBKEY" -m dist/SHA256SUMS
          fi
      # The notes: the Unreleased section of CHANGELOG.md, which the app shows as "What's new".
      - name: Release notes
        run: |
          {
            echo "Built automatically from main at ${GITHUB_SHA::7}. It is replaced on every push; for a fixed version use a numbered release."
            echo
            scripts/release-notes.sh || true
          } > notes.md
          cat notes.md
      - name: Replace the "Latest build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes-file notes.md
