[package]
name = "repohub-server"
version = "0.2.0"
edition = "2024"
publish = false
description = "Serves the RepoHub web build and proxies the GitHub API, keeping the token server-side."

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "proxy-from-env", "gzip"] }
# Already pulled in by ureq's `gzip` feature; also used to compress large /gh/* JSON responses to browsers.
flate2 = "1"

# Optimized for size as one unit: the server only forwards requests and sends files, so
# opt-level = "z" keeps its Docker image layer small while preserving worker panic isolation.
[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
